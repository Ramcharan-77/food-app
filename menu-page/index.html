<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - FoodApp</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body data-root="..">
    <main class="container">
      <h1>Explore Menu</h1>

      <!-- Search & Category Filter Bar -->
      <div class="filter-bar">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search biryani, dosa, dessert..."
        />
        <div id="category-pills" class="pill-group"></div>
      </div>

      <div id="menu-list" class="food-grid"></div>

      <div id="scroll-sentinel" style="text-align: center; padding: 24px; color: var(--text-muted)">
        Loading more dishes...
      </div>
    </main>

    <script src="../shared/utils.js"></script>
    <script src="./menu.js?v=2"></script>
  </body>
</html>
